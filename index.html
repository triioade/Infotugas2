<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Info Tugas | Dashboard Mahasiswa</title>

>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#2b4539" />


    <link rel="apple-touch-icon" href="/icons/apple-icon-180.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Info Tugas" />


    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <style>

      #update-loader {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        background: white;
        z-index: 9999;
        flex-direction: column;
        font-family: sans-serif;
      }
      #update-loader .spinner {
        width: 40px;
        height: 40px;
        border: 4px solid #2563eb;
        border-top-color: transparent;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body class="dark:bg-gray-900">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <div id="update-loader" style="display:none;">
      <div class="spinner"></div>
      <p style="margin-top:10px;color:#374151;font-size:14px;">Memuat versi terbaru...</p>
    </div>

    <script>
      (async function () {
        try {
          let needReload = false;

          if ("caches" in window) {
            const names = await caches.keys();
            for (let name of names) {
              await caches.delete(name);
              needReload = true;
            }
          }

          if ("serviceWorker" in navigator) {
            const regs = await navigator.serviceWorker.getRegistrations();
            for (let reg of regs) {
              await reg.unregister();
              needReload = true;
            }
          }

      
          if (needReload && sessionStorage.getItem("cache_cleared") !== "yes") {
            sessionStorage.setItem("cache_cleared", "yes");

            
            document.getElementById("update-loader").style.display = "flex";

            setTimeout(() => {
              window.location.reload(true);
            }, 500); 
          }
        } catch (err) {
          console.error("Update check error:", err);
        }
      })();
    </script>
  </body>
</html>
